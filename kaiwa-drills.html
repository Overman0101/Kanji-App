<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会話道 — Conversation Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-950:#141F33; --indigo-900:#1B2A41; --indigo-800:#22375A; --indigo-700:#2C4468; --indigo-600:#3A5075;
    --paper:#F3EFE4; --paper-dim:#C9C6BB;
    --gold:#E3A857; --gold-dim:#8A6B3B;
    --moss:#6FA287; --moss-deep:#3E6650;
    --vermillion:#C1440E; --vermillion-deep:#8C3009;
    --radius-tile:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--indigo-800), transparent 60%),
      linear-gradient(180deg, var(--indigo-950) 0%, #101A2C 100%);
    color:var(--paper); min-height:100%; display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{ width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; position:relative; overflow-x:hidden; }
  .kanji-font{ font-family:'Shippori Mincho', serif; }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .tab-header{ position:relative; padding:24px 22px 4px; }
  .tab-header .ghost-kanji{ position:absolute; right:0; top:-16px; font-size:120px; color:rgba(243,239,228,0.05); }
  .tab-header h1{ position:relative; font-family:'Shippori Mincho', serif; font-weight:800; font-size:26px; margin:0 0 4px; }
  .tab-header p{ position:relative; margin:0; color:var(--paper-dim); font-size:14px; line-height:1.55; max-width:34ch; }

  .screen{ flex:1; display:flex; flex-direction:column; padding:8px 22px 20px; animation:fadein .22s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---------- dialect + politeness pills ---------- */
  .register-row{ display:flex; gap:8px; padding:0 22px; margin:18px 0 6px; }
  .register-pill{ flex:1; text-align:center; padding:11px 6px; border-radius:12px; border:1.5px solid var(--indigo-600); background:var(--indigo-800); cursor:pointer; font-family:inherit; color:inherit; }
  .register-pill .rp-label{ font-size:13px; font-weight:800; color:var(--paper-dim); }
  .register-pill .rp-ja{ font-size:11px; color:var(--paper-dim); margin-top:2px; }
  /* dialect axis */
  .register-pill[data-r="standard"].active{ border-color:var(--paper-dim); background:rgba(201,198,187,0.14); }
  .register-pill[data-r="standard"].active .rp-label{ color:var(--paper); }
  .register-pill[data-r="kansai"].active{ border-color:var(--vermillion); background:rgba(193,68,14,0.14); }
  .register-pill[data-r="kansai"].active .rp-label{ color:var(--vermillion); }
  /* politeness axis */
  .register-pill[data-p="casual"].active{ border-color:var(--moss); background:rgba(111,162,135,0.14); }
  .register-pill[data-p="casual"].active .rp-label{ color:var(--moss); }
  .register-pill[data-p="polite"].active{ border-color:var(--gold); background:rgba(227,168,87,0.14); }
  .register-pill[data-p="polite"].active .rp-label{ color:var(--gold); }
  .register-pill[data-p="keigo"].active{ border-color:var(--vermillion-deep); background:rgba(140,48,9,0.14); }
  .register-pill[data-p="keigo"].active .rp-label{ color:var(--vermillion-deep); }
  .register-pill.disabled{ opacity:.32; cursor:not-allowed; }

  /* explains which styles fit the chosen scene, and why some pills are greyed out */
  .setting-note{ margin:10px 22px 0; padding:10px 12px; border-radius:10px; border:1px dashed var(--indigo-600); font-size:12px; line-height:1.55; color:var(--paper-dim); }
  .setting-note b{ color:var(--paper); font-weight:700; }

  .scenario-list{ display:flex; flex-direction:column; gap:8px; padding:0 22px; }
  .scenario-row{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:var(--radius-tile); background:var(--indigo-800); border:1.5px solid var(--indigo-700); cursor:pointer; width:100%; text-align:left; font-family:inherit; color:inherit; }
  .scenario-row.active{ border-color:var(--gold); background:rgba(227,168,87,0.10); }
  .scenario-row .sc-icon{ width:40px; height:40px; flex:0 0 auto; border-radius:10px; background:var(--indigo-900); border:1px solid var(--indigo-700); display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho', serif; font-size:19px; color:var(--gold); }
  .scenario-row.active .sc-icon{ border-color:var(--gold); background:rgba(227,168,87,0.16); }
  .scenario-row .sc-title{ font-size:14px; font-weight:700; }
  .scenario-row .sc-ja{ font-size:12px; color:var(--paper-dim); margin-top:1px; }
  .scenario-row .sc-group-tag{ margin-left:auto; font-size:10px; font-weight:800; letter-spacing:.04em; color:var(--gold); border:1px solid var(--gold-dim); border-radius:999px; padding:3px 8px; flex:0 0 auto; }

  .topic-row{ display:flex; gap:8px; overflow-x:auto; padding:0 22px; margin:14px 0 0; }
  .topic-chip{
    flex:0 0 auto; padding:9px 13px; border-radius:999px; border:1.5px solid var(--indigo-600);
    background:var(--indigo-800); color:var(--paper-dim); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .topic-chip.active{ border-color:var(--gold); color:var(--gold); background:rgba(227,168,87,0.12); }

  .start-btn, .primary-btn{
    display:block; width:100%; text-align:center; padding:16px; border-radius:16px; border:none;
    background:var(--gold); color:var(--indigo-950); font-weight:900; font-size:16px; cursor:pointer; font-family:inherit;
    margin-top:22px; box-shadow:0 4px 0 var(--gold-dim);
  }
  .start-btn:disabled, .primary-btn:disabled{ background:var(--indigo-700); color:var(--paper-dim); box-shadow:none; cursor:not-allowed; }
  .start-btn:not(:disabled):active, .primary-btn:not(:disabled):active{ transform:translateY(3px); box-shadow:0 1px 0 var(--gold-dim); }
  .secondary-btn{ display:block; width:100%; text-align:center; padding:14px; border-radius:16px; border:1.5px solid var(--indigo-600); background:transparent; color:var(--paper); font-weight:700; font-size:15px; cursor:pointer; margin-top:10px; font-family:inherit; }

  .stat-cards{ display:flex; gap:12px; margin:16px 0 4px; }
  .stat-card{ flex:1; background:var(--indigo-800); border:1px solid var(--indigo-700); border-radius:var(--radius-tile); padding:14px 12px; }
  .stat-card .num{ font-size:22px; font-weight:900; line-height:1; color:var(--gold); }
  .stat-card .label{ font-size:12px; color:var(--paper-dim); margin-top:6px; }

  /* ---------- chat screen ---------- */
  .chat-header{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:14px 16px; background:linear-gradient(180deg, var(--indigo-950) 85%, transparent); }
  .chat-header .icon-btn{ background:none; border:none; color:var(--paper-dim); font-size:20px; cursor:pointer; padding:4px; flex:0 0 auto; }
  .chat-header .ch-info{ flex:1; min-width:0; }
  .chat-header .ch-title{ font-size:14px; font-weight:700; }
  .chat-header .ch-sub{ font-size:11px; color:var(--paper-dim); margin-top:1px; }

  .chat-body{ flex:1; display:flex; flex-direction:column; gap:12px; padding:6px 16px 16px; overflow-y:auto; }
  .bubble-row{ display:flex; }
  .bubble-row.assistant{ justify-content:flex-start; }
  .bubble-row.user{ justify-content:flex-end; }
  .bubble{ max-width:82%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.6; }
  .bubble-row.assistant .bubble{ background:var(--indigo-800); border:1px solid var(--indigo-700); border-bottom-left-radius:4px; }
  .bubble-row.user .bubble{ background:rgba(227,168,87,0.16); border:1px solid var(--gold-dim); border-bottom-right-radius:4px; }
  .bubble .b-jp{ font-family:'Shippori Mincho', serif; }
  .bubble .b-romaji{ font-size:12px; color:var(--gold); margin-top:5px; }
  .bubble .b-en{ font-size:12px; color:var(--paper-dim); margin-top:3px; font-style:italic; }
  .bubble-row.user .bubble .b-romaji{ color:var(--gold-dim); }

  .option-bubble{
    display:block; width:100%; text-align:right; padding:13px 16px; border-radius:16px;
    border:1.5px solid var(--indigo-600); background:var(--indigo-800); color:var(--paper);
    font-size:16px; font-family:'Shippori Mincho', serif; cursor:pointer;
  }
  .option-bubble:active{ background:var(--indigo-700); }

  .chat-footer{ padding:10px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--indigo-700); background:rgba(20,31,51,0.92); }
  .continue-btn{
    display:block; width:100%; padding:14px; border-radius:14px; border:none;
    background:var(--gold); color:var(--indigo-950); font-weight:900; font-size:15px; cursor:pointer; font-family:inherit;
  }

  .results-inline{ text-align:center; padding:6px 4px; }
  .results-inline .ri-big{ font-family:'Shippori Mincho', serif; font-size:15px; margin-bottom:10px; }
  .results-inline .ri-stats{ display:flex; gap:10px; margin-bottom:12px; }
  .results-inline .stat-card{ margin:0; }

  /* ---------- lessons ---------- */
  .lesson-tabs{ display:flex; gap:8px; padding:0 22px; margin:18px 0 4px; }
  .lesson-tab{ flex:1; text-align:center; padding:10px 4px; border-radius:12px; border:1.5px solid var(--indigo-600); background:var(--indigo-800); color:var(--paper-dim); font-size:12px; font-weight:800; cursor:pointer; }
  .lesson-tab.active{ border-color:var(--gold); color:var(--gold); background:rgba(227,168,87,0.12); }
  .lesson-block{ margin-bottom:22px; }
  .lesson-block h3{ font-family:'Shippori Mincho', serif; font-size:17px; margin:0 0 8px; }
  .lesson-block p{ font-size:13.5px; color:var(--paper-dim); line-height:1.7; margin:0 0 10px; }
  .phrase-table{ display:flex; flex-direction:column; gap:6px; }
  .phrase-row{ background:var(--indigo-800); border:1px solid var(--indigo-700); border-radius:10px; padding:9px 12px; }
  .phrase-row .p-jp{ font-family:'Shippori Mincho', serif; font-size:16px; }
  .phrase-row .p-romaji{ font-size:11px; color:var(--gold); margin-top:2px; }
  .phrase-row .p-en{ font-size:11.5px; color:var(--paper-dim); margin-top:2px; }

  .mini-table{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .mini-table-row{ display:grid; gap:8px; background:var(--indigo-800); border:1px solid var(--indigo-700); border-radius:8px; padding:8px 10px; }
  .mini-table-row.mini-table-head{ background:transparent; border:none; padding:0 10px; }
  .mini-table-row.mini-table-head .mtc{ font-size:10px; font-weight:800; letter-spacing:.04em; color:var(--gold); text-transform:uppercase; }
  .mini-table .mtc{ font-size:12.5px; color:var(--paper); line-height:1.4; }
  .mini-table-row:not(.mini-table-head) .mtc:first-child{ font-family:'Shippori Mincho', serif; font-size:14px; }
  .mini-table.jp-col2 .mini-table-row:not(.mini-table-head) .mtc:nth-child(2){ font-family:'Shippori Mincho', serif; font-size:14px; }
  .mini-table-row:not(.mini-table-head) .mtc:last-child{ color:var(--paper-dim); font-size:11.5px; font-family:'Zen Kaku Gothic New', sans-serif; }

  /* ---------- compare ---------- */
  .fc-counter{ text-align:center; color:var(--paper-dim); font-size:13px; font-weight:700; margin:14px 0 10px; }
  .compare-card{ background:var(--indigo-800); border:1px solid var(--indigo-700); border-radius:20px; padding:22px; }
  .compare-row{ display:flex; flex-direction:column; gap:10px; }
  .compare-item{ background:var(--indigo-900); border:1px solid var(--indigo-700); border-radius:12px; padding:12px 14px; }
  .compare-item .ci-tag{ font-size:10px; font-weight:800; letter-spacing:.05em; margin-bottom:4px; }
  .compare-item .ci-jp{ font-family:'Shippori Mincho', serif; font-size:17px; }
  .compare-item .ci-romaji{ font-size:11px; color:var(--paper-dim); margin-top:3px; }
  .compare-item .ci-en{ font-size:11px; color:var(--paper-dim); font-style:italic; margin-top:1px; }
  .fc-nav{ display:flex; gap:10px; margin-top:14px; }
  .fc-nav button{ flex:1; padding:14px; border-radius:14px; border:1.5px solid var(--indigo-600); background:var(--indigo-800); color:var(--paper); font-weight:700; font-size:15px; cursor:pointer; font-family:inherit; }
  .fc-nav button.next{ background:var(--gold); color:var(--indigo-950); border:none; }

  /* ---------- progress ---------- */
  .progress-block{ background:var(--indigo-800); border:1px solid var(--indigo-700); border-radius:var(--radius-tile); padding:16px 16px 14px; margin-top:16px; }
  .progress-block-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .progress-block .pb-label{ font-family:'Shippori Mincho', serif; font-size:17px; font-weight:700; }
  .progress-block .pb-count{ font-size:12px; color:var(--paper-dim); }
  .seg-bar{ display:flex; height:10px; border-radius:999px; overflow:hidden; background:var(--indigo-700); }
  .pb-legend{ display:flex; gap:14px; margin-top:10px; flex-wrap:wrap; }
  .pb-legend span{ font-size:11px; color:var(--paper-dim); display:flex; align-items:center; gap:5px; }
  .pb-legend i{ display:inline-block; width:8px; height:8px; border-radius:999px; }
  .mini-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--indigo-700); }
  .mini-row:last-child{ border-bottom:none; }
  .mini-row .mini-sit{ flex:1; min-width:0; font-size:12.5px; color:var(--paper); }
  .mini-row .mini-tag{ font-size:10px; color:var(--paper-dim); }
  .mini-row .mini-score{ font-size:12px; color:var(--vermillion); font-weight:800; flex:0 0 auto; }
  .empty-note{ text-align:center; color:var(--paper-dim); font-size:13px; margin-top:8px; }

  /* ---------- bottom tab bar ---------- */
  .tabbar{ position:sticky; bottom:0; display:flex; border-top:1px solid var(--indigo-700); background:rgba(20,31,51,0.92); backdrop-filter:blur(6px); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); }
  .tab-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; padding:8px 4px; cursor:pointer; color:var(--paper-dim); font-family:inherit; }
  .tab-btn .tico{ font-family:'Shippori Mincho', serif; font-size:20px; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--indigo-800); border:1px solid var(--indigo-700); }
  .tab-btn.active{ color:var(--gold); }
  .tab-btn.active .tico{ border-color:var(--gold); color:var(--gold); background:rgba(227,168,87,0.12); }
  .tab-btn .tlabel{ font-size:11px; font-weight:700; }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA — SCENARIOS
   Scenarios can optionally carry a `topics` list. That marks them
   as a *group* — e.g. "Phone Call" isn't one fixed conversation,
   it's a category of situations (booking something, calling in
   sick, etc.), and it doesn't make sense to pretend otherwise.
   Scenarios without `topics` are single, self-contained scripts.

   Every scenario (or every topic inside a group) resolves to a
   SETTING — see SETTINGS below. A topic's own `setting` overrides
   its parent scenario's, because one group can mix social distances
   (calling a restaurant vs. calling your boss).
   ========================================================= */
const SCENARIOS = [
  { id:'restaurant', icon:'店', title:'Restaurant', ja:'レストラン', setting:'service', topics:[
      { id:'ordering', title:'Ordering Food', ja:'注文' },
      { id:'table', title:'Getting a Table', ja:'席の案内' },
      { id:'allergy', title:'Food Allergy', ja:'アレルギー' },
      { id:'wrong_dish', title:'Wrong Dish', ja:'注文の間違い' },
    ] },
  { id:'directions', icon:'道', title:'Directions', ja:'道案内', setting:'stranger', topics:[
      { id:'to_station', title:'Finding the Station', ja:'駅までの道' },
      { id:'conbini', title:'Finding a Convenience Store', ja:'コンビニ探し' },
      { id:'how_far', title:'How Far Is It', ja:'距離を聞く' },
      { id:'lost', title:'Lost and Asking for Help', ja:'道に迷う' },
    ] },
  { id:'interview',  icon:'面', title:'Job Interview', ja:'面接', setting:'formal', topics:[
      { id:'basics', title:'Self-Introduction', ja:'自己紹介' },
      { id:'strengths', title:'Strengths & Weaknesses', ja:'長所と短所' },
      { id:'experience', title:'Work Experience', ja:'職歴' },
      { id:'questions', title:'Questions for the Interviewer', ja:'逆質問' },
    ] },
  { id:'shopping',   icon:'服', title:'Shopping', ja:'買い物', setting:'shop', topics:[
      { id:'sizes', title:'Sizes & Prices', ja:'サイズと値段' },
      { id:'discount', title:'Asking for a Discount', ja:'値引き交渉' },
      { id:'return', title:'Returning an Item', ja:'返品' },
      { id:'gift', title:'Buying a Gift', ja:'プレゼント選び' },
    ] },
  { id:'hotel',      icon:'宿', title:'Hotel', ja:'チェックイン', setting:'service', topics:[
      { id:'checkin', title:'Checking In', ja:'チェックイン' },
      { id:'request', title:'Requesting Something', ja:'部屋への要望' },
      { id:'checkout', title:'Checking Out', ja:'チェックアウト' },
      { id:'problem', title:'Room Problem', ja:'部屋のトラブル' },
    ] },
  { id:'friend',     icon:'友', title:'With a Friend', ja:'友達', setting:'friend', topics:[
      { id:'plans', title:'Making Weekend Plans', ja:'週末の予定' },
      { id:'lunch', title:'Deciding on Lunch', ja:'お昼どうする' },
      { id:'late', title:'Running Late', ja:'遅刻の連絡' },
      { id:'birthday', title:'Planning a Birthday', ja:'誕生日の計画' },
    ] },
  { id:'doctor',     icon:'医', title:"Doctor's Visit", ja:'病院', setting:'service', topics:[
      { id:'fever', title:'Fever Symptoms', ja:'発熱の症状' },
      { id:'reception', title:'First Visit Reception', ja:'初診受付' },
      { id:'pharmacy', title:'At the Pharmacy', ja:'薬局にて' },
      { id:'injury', title:'Minor Injury', ja:'ケガの診察' },
    ] },
  { id:'station',    icon:'駅', title:'Train Station', ja:'駅', setting:'service', topics:[
      { id:'tickets', title:'Buying a Ticket', ja:'切符を買う' },
      { id:'ic', title:'Charging an IC Card', ja:'ICカードのチャージ' },
      { id:'transfer', title:'Asking About Transfers', ja:'乗り換え案内' },
      { id:'shinkansen', title:'Shinkansen Ticket', ja:'新幹線の切符' },
    ] },
  { id:'phone',      icon:'電', title:'Phone Call', ja:'電話', setting:'service', topics:[
      { id:'reservation', title:'Making a Reservation', ja:'予約' },
      { id:'sick', title:'Calling in Sick', ja:'欠勤の連絡', setting:'formal' },   // you're calling your boss
      { id:'delivery', title:'Checking a Delivery', ja:'配達の確認' },
      { id:'wrong_bill', title:'Billing Mistake', ja:'請求の間違い' },
    ] },
  { id:'workplace',  icon:'仕', title:'Workplace', ja:'職場', setting:'coworker', topics:[
      { id:'deadline', title:'Missing a Deadline', ja:'締め切りの相談' },
      { id:'meeting', title:'Scheduling a Meeting', ja:'会議の日程調整' },
      { id:'help', title:'Asking for Help', ja:'助けを求める' },
      { id:'leave', title:'Requesting Time Off', ja:'休暇の申請' },
    ] },
  { id:'smalltalk',  icon:'雑', title:'Small Talk', ja:'雑談', setting:'coworker', topics:[
      { id:'weather', title:'Weather & Weekend', ja:'天気と週末' },
      { id:'hobbies', title:'Hobbies', ja:'趣味' },
      { id:'work', title:'Talking About Work', ja:'仕事の話' },
      { id:'food', title:'Food & Restaurants', ja:'食べ物の話' },
    ] },
  { id:'travel',     icon:'旅', title:'Travel Problems', ja:'旅行トラブル', setting:'service', topics:[
      { id:'missed_train', title:'Missed the Train', ja:'乗り遅れ' },
      { id:'lost_item', title:'Lost Item', ja:'忘れ物' },
      { id:'wrong_reservation', title:'Wrong Room/Reservation', ja:'予約の間違い' },
      { id:'cancelled', title:'Cancelled Flight', ja:'欠航' },
    ] },
  { id:'advice',     icon:'相', title:'Asking for Advice', ja:'相談', setting:'coworker', topics:[
      { id:'tired', title:'Feeling Overworked', ja:'疲れた時の相談' },
      { id:'career', title:'Changing Jobs', ja:'転職の相談' },
      { id:'study', title:'Study Struggles', ja:'勉強の悩み' },
      { id:'moving', title:'Moving House', ja:'引っ越しの相談' },
    ] },
  { id:'argument',   icon:'仲', title:'Argument & Making Up', ja:'仲直り', setting:'friend', topics:[
      { id:'read', title:'Left on Read', ja:'既読無視' },
      { id:'forgot', title:'Forgot Plans', ja:'約束を忘れた' },
      { id:'broke', title:'Broke Something Borrowed', ja:'借り物を壊した' },
      { id:'hurtful', title:'Said Something Hurtful', ja:'きつい一言' },
    ] },
  { id:'drinking',   icon:'飲', title:'Drinking Party', ja:'飲み会', setting:'coworker', topics:[
      { id:'order', title:'Ordering Drinks', ja:'ドリンクの注文' },
      { id:'pouring', title:'Pouring Etiquette', ja:'お酌のマナー' },
      { id:'nijikai', title:'Skipping the After-Party', ja:'二次会を断る' },
      { id:'split', title:'Splitting the Bill', ja:'割り勘' },
    ] },
];
function getScenario(id){ return SCENARIOS.find(s => s.id === id); }
// The key used to look up SCRIPTS: plain scenario id for simple scenarios,
// "scenarioId.topicId" for group scenarios.
function scriptKeyFor(scenarioId, topicId){
  const scenario = getScenario(scenarioId);
  return (scenario && scenario.topics) ? `${scenarioId}.${topicId}` : scenarioId;
}
function describeScriptKey(key){
  const [scenarioId, topicId] = key.split('.');
  const scenario = getScenario(scenarioId);
  if(!scenario) return { icon:'?', title:key };
  if(topicId && scenario.topics){
    const topic = scenario.topics.find(t => t.id === topicId);
    return { icon: scenario.icon, title: `${scenario.title} · ${topic ? topic.title : topicId}` };
  }
  return { icon: scenario.icon, title: scenario.title };
}

/* =========================================================
   DATA — DIALECT × POLITENESS, AND SETTINGS
   Dialect (regional variety) and politeness (formality level) are
   independent axes. A combo id is `${dialect}_${politeness}`.

   What decides which combos are *natural* is the SETTING: who you're
   talking to and how close you are. Settings are the single source of
   truth — a combo being absent from a script now means "not natural
   here", not "nobody has written it yet" (validateScripts() enforces
   that the data and the settings agree).

   Each setting has:
     combos  the combos the learner may practice in this setting
     partner how the OTHER person speaks. Your choice is about how *you*
             speak; a waiter doesn't go casual because you did.
               'match'          the partner mirrors your combo
               'standard_keigo' a fixed combo (staff, interviewers…)
               { from: to }     per-combo map; unmapped combos mirror you
     note    the one-line reason shown under the pills
   To open a setting to a new style later (say, kansai_polite for
   service), add it to `combos`, then write those lines — the validator
   lists exactly which turns are missing.
   ========================================================= */
const DIALECTS = [
  { id:'standard', label:'Standard', ja:'標準語' },
  { id:'kansai', label:'Kansai-ben', ja:'関西弁' },

const POLITENESS = [

  { id:'keigo', label:'Keigo', ja:'敬語' },

const SETTINGS = {
  service:  { label:'Customer ↔ staff',

  shop:     { label:'Shops & stalls',
              combos:['standard_polite','standard_keigo','kansai_casual'],

  stranger: { label:'Strangers on the street',

              note:'Locals are often relaxed with strangers. A passerby answers in kind, but never as stiffly as keigo.' },
  formal:   { label:'Business & superiors',

  friend:   { label:'Close friends',
              combos:['standard_casual','kansai_casual'],
              partner:'match',
              note:'With close friends, polite or keigo would sound cold and distant, so only casual speech is offered.' },

const COMBO_META = {
  standard_casual: { label:'Standard', sub:'Casual', ja:'標準語・カジュアル', colorVar:'--moss' },
  standard_polite: { label:'Standard', sub:'Polite', ja:'標準語・丁寧', colorVar:'--paper-dim' },
  standard_keigo:  { label:'Standard', sub:'Keigo',  ja:'標準語・敬語', colorVar:'--gold' },
  kansai_casual:   { label:'Kansai-ben', sub:'Casual', ja:'関西弁・カジュアル', colorVar:'--vermillion' },
  kansai_polite:   { label:'Kansai-ben', sub:'Polite', ja:'関西弁・丁寧', colorVar:'--vermillion' },
  kansai_keigo:    { label:'Kansai-ben', sub:'Keigo',  ja:'関西弁・敬語', colorVar:'--vermillion' },
};
function comboMeta(combo){
  return COMBO_META[combo] || { label:combo, sub:'', ja:'', colorVar:'--paper-dim' };
}
// Combo ids are only ever built/split here, so nothing else depends on the "_" format.
function comboId(dialect, politeness){ return `${dialect}_${politeness}`; }
function parseCombo(combo){ const [dialect, politeness] = combo.split('_'); return { dialect, politeness }; }

// Which setting governs a script key like "restaurant" or "phone.sick".
function settingFor(scriptKey){
  const [scenarioId, topicId] = scriptKey.split('.');
  const scenario = getScenario(scenarioId);
  const topic = (scenario && scenario.topics) ? scenario.topics.find(t => t.id === topicId) : null;
  const id = (topic && topic.setting) || (scenario && scenario.setting);
  if(!SETTINGS[id]) console.error(`No valid setting for "${scriptKey}" (got "${id}"); falling back to "service".`);
  return SETTINGS[id] || SETTINGS.service;
}
// How the other person speaks, given the combo the learner picked.
function partnerComboFor(setting, userCombo){
  const p = setting.partner;
  if(p === 'match') return userCombo;
  if(typeof p === 'string') return p;
  return p[userCombo] || userCombo;
}

/* =========================================================
   DATA CHECK
   Runs at boot and reports (in the console) any place where the
   scripts and the SETTINGS disagree, so the two can't drift apart:
     - a scenario with no script, or no setting
     - a user turn missing a combo its setting allows
     - a user turn carrying a combo its setting does NOT allow
     - a partner turn missing (or carrying) a variant the partner
       will actually speak in
   ========================================================= */
function validateScripts(){
  const problems = [];
  SCENARIOS.forEach(sc => {
    const keys = sc.topics ? sc.topics.map(t => `${sc.id}.${t.id}`) : [sc.id];
    keys.forEach(k => { if(!SCRIPTS[k]) problems.push(`${k}: no script`); });
    const everyTopicHasSetting = sc.topics && sc.topics.every(t => t.setting);
    if(!sc.setting && !everyTopicHasSetting) problems.push(`${sc.id}: no setting`);
    if(sc.setting && !SETTINGS[sc.setting]) problems.push(`${sc.id}: unknown setting "${sc.setting}"`);
    (sc.topics || []).forEach(t => { if(t.setting && !SETTINGS[t.setting]) problems.push(`${sc.id}.${t.id}: unknown setting "${t.setting}"`); });
  });
  Object.entries(SCRIPTS).forEach(([key, turns]) => {
    const setting = settingFor(key);
    turns.forEach((turn, i) => {
      if(!turn.variants) return;
      const have = Object.keys(turn.variants);
      if(turn.speaker === 'user'){
        setting.combos.forEach(c => { if(!have.includes(c)) problems.push(`${key} turn ${i} (you): missing ${c}`); });
        have.forEach(c => { if(!setting.combos.includes(c)) problems.push(`${key} turn ${i} (you): ${c} isn't allowed in "${setting.label}"`); });
      } else {
        const needed = new Set(setting.combos.map(c => partnerComboFor(setting, c)));
        needed.forEach(c => { if(!have.includes(c)) problems.push(`${key} turn ${i} (partner): missing ${c}`); });
        have.forEach(c => { if(!needed.has(c)) problems.push(`${key} turn ${i} (partner): ${c} is never spoken in "${setting.label}"`); });
      }
    });
  });
  problems.forEach(p => console.warn('[script check]', p));
  return problems;
}

/* =========================================================
   STORAGE
   Uses the host-provided window.storage when available (inside
   Claude), but falls back to plain localStorage so this remains a
   real, working standalone HTML file if opened in any browser.
   ========================================================= */
const STORE_KEY = 'kaiwa_chat_progress_v3';
function defaultProgress(){ return { dialect:'standard', politeness:'polite', scenario:'restaurant', topic:'ordering', stats:{} }; }
// Older saves tagged friend/argument lines as standard_polite even though they
// are plain-form speech. Move that progress over to standard_casual.
function migrateProgress(p){
  Object.keys(p.stats || {}).forEach(k => {
    if(/^(friend|argument):\d+:standard_polite$/.test(k)){
      const nk = k.replace(/standard_polite$/, 'standard_casual');
      if(!p.stats[nk]) p.stats[nk] = p.stats[k];
      delete p.stats[k];
    }
  });
  return p;
}
async function loadProgress(){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(STORE_KEY);
      if(res && res.value) return migrateProgress(Object.assign(defaultProgress(), JSON.parse(res.value)));
    }
  }catch(e){ console.warn('host storage unavailable; trying localStorage'); }
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrateProgress(Object.assign(defaultProgress(), JSON.parse(raw)));
  }catch(e){ console.warn('localStorage unavailable'); }
  return defaultProgress();
}
async function saveProgress(p){
  const raw = JSON.stringify(p);
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(STORE_KEY, raw);
      return;
    }
  }catch(e){ console.warn('host storage save failed; trying localStorage'); }
  try{ localStorage.setItem(STORE_KEY, raw); }
  catch(e){ console.error('save failed', e); }
}

let PROGRESS = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function statFor(key){
  const st = PROGRESS.stats[key] || {seen:0, correct:0};
  // Backward-compatible migration for progress saved by earlier versions.
  // (`correct` is just "times reviewed" now — tapping a line always counts.)
  if(typeof st.streak !== 'number') st.streak = 0;
  if(typeof st.bestStreak !== 'number') st.bestStreak = 0;
  if(typeof st.lastSeen !== 'number') st.lastSeen = 0;
  return st;
}
function masteryStatus(key){
  const st = statFor(key);
  // Requires both experience and recent consistency — three lucky answers a
  // long time ago no longer keeps something "mastered" forever.
  if(st.correct >= 3 && st.streak >= 2) return 'mastered';
  if(st.seen > 0) return 'learning';
  return 'new';
}

// Every practice item is a (script, user turn, combo) that actually exists.
// validateScripts() guarantees these match what each setting allows.
const PRACTICE_ITEMS = [];
Object.entries(SCRIPTS).forEach(([scriptKey, turns]) => {
  turns.forEach((turn, i) => {
    if(turn.speaker !== 'user') return;
    Object.keys(turn.variants).forEach(combo => {
      PRACTICE_ITEMS.push({ scriptKey, turnIndex:i, combo });
    });
  });
});
// Every (scriptKey, turnIndex) pair that's a user decision point, for Compare.
const COMPARE_POOL = [];
Object.entries(SCRIPTS).forEach(([scriptKey, turns]) => {
  turns.forEach((turn, i) => { if(turn.speaker === 'user') COMPARE_POOL.push({ scriptKey, turnIndex:i }); });
});

// The combos a learner may pick for a script come from its setting,
// not from whatever variants happen to exist in the data.
function availableCombos(scriptKey){ return settingFor(scriptKey).combos; }

function pickHTML(items, activeId, onClickName, attrName){
  return items.map(it => `
    <button type="button" class="register-pill ${activeId===it.id ? 'active' : ''} ${it.disabled ? 'disabled' : ''}" ${attrName ? `${attrName}="${it.id}"` : ''}
      ${it.disabled ? `disabled aria-disabled="true" title="${it.hint || ''}"` : ''} onclick="${it.disabled ? '' : `${onClickName}('${it.id}')`}">
      <div class="rp-label">${it.label}</div><div class="rp-ja">${it.ja}</div>
    </button>`).join('');
}
function currentScriptKey(){ return scriptKeyFor(PROGRESS.scenario, PROGRESS.topic); }
function dialectAndPolitenessPillsHTML(){
  const setting = settingFor(currentScriptKey());
  const combos = setting.combos.map(parseCombo);
  const dialectsAvail = new Set(combos.map(c => c.dialect));
  const politenessAvail = new Set(combos.filter(c => c.dialect === PROGRESS.dialect).map(c => c.politeness));
  const why = `Not used in “${setting.label}”`;
  const dialectItems = DIALECTS.map(d => ({ ...d, disabled: !dialectsAvail.has(d.id), hint: why }));
  const politenessItems = POLITENESS.map(p => ({
    ...p,
    disabled: !politenessAvail.has(p.id),
    hint: dialectsAvail.has(PROGRESS.dialect) ? `${why} with ${DIALECTS.find(d => d.id === PROGRESS.dialect).label}` : why,
  }));
  return `
    <div class="register-row">${pickHTML(dialectItems, PROGRESS.dialect, 'setDialect', 'data-r')}</div>
    <div class="register-row" style="margin-top:8px;">${pickHTML(politenessItems, PROGRESS.politeness, 'setPoliteness', 'data-p')}</div>
    <div class="setting-note"><b>${setting.label}.</b> ${setting.note}</div>`;
}
function currentCombo(){ return comboId(PROGRESS.dialect, PROGRESS.politeness); }
function fixComboForCurrentScript(){
  const combos = availableCombos(currentScriptKey());
  if(combos.length && !combos.includes(currentCombo())){
    const { dialect, politeness } = parseCombo(combos[0]);
    PROGRESS.dialect = dialect; PROGRESS.politeness = politeness;
  }
}
function setDialect(id){
  PROGRESS.dialect = id;
  const combos = availableCombos(currentScriptKey());
  if(!combos.includes(currentCombo())){
    const fallback = combos.find(c => parseCombo(c).dialect === id);
    if(fallback) PROGRESS.politeness = parseCombo(fallback).politeness;
  }
  saveProgress(PROGRESS); fc = null; renderActiveTab();
}
function setPoliteness(id){
  PROGRESS.politeness = id;
  const combos = availableCombos(currentScriptKey());
  if(!combos.includes(currentCombo())){
    const fallback = combos.find(c => parseCombo(c).politeness === id);
    if(fallback) PROGRESS.dialect = parseCombo(fallback).dialect;
  }
  saveProgress(PROGRESS); fc = null; renderActiveTab();
}

function tabbarHTML(){
  const tabs = [
    {id:'chat', icon:'話', label:'Chat'},
    {id:'flashcards', icon:'札', label:'Compare'},

      </button>`).join('')}

}
function switchTab(tab){ activeTab = tab; session = null; fc = null; renderActiveTab(); }
function renderActiveTab(){
  if(activeTab === 'chat') renderChatSetupOrScreen();
  else if(activeTab === 'flashcards') renderCompare();
  else if(activeTab === 'lessons') renderLessons();

function renderChatSetupOrScreen(){
  if(session){ renderChatScreen(); return; }
  const scenario = getScenario(PROGRESS.scenario);
  app.innerHTML = `
    <div class="tab-header"><div class="ghost-kanji kanji-font">話</div><h1>会話道</h1><p>Pick a scene, then a dialect and a politeness level. The conversation plays out turn by turn — you choose your line at each step.</p></div>
    <div class="screen">

}
function selectScenario(id){
  PROGRESS.scenario = id;
  const scenario = getScenario(id);
  PROGRESS.topic = scenario.topics ? scenario.topics[0].id : null;
  fixComboForCurrentScript();
  saveProgress(PROGRESS);
  renderChatSetupOrScreen();
}
function selectTopic(topicId){
  PROGRESS.topic = topicId;
  fixComboForCurrentScript();
  saveProgress(PROGRESS);
  renderChatSetupOrScreen();
}

// Your lines follow the combo you picked. The other person's lines follow
// the setting's `partner` rule instead — staff stay formal whatever you choose.
function resolveLine(turn, sess){
  if(!turn.variants) return { jp:turn.jp, romaji:turn.romaji, en:turn.en };
  const combo = turn.speaker === 'ai' ? sess.partnerCombo : sess.combo;
  return turn.variants[combo] || turn.variants[sess.combo] || Object.values(turn.variants)[0];
}
function startConversation(){
  fixComboForCurrentScript();
  const scriptKey = currentScriptKey();
  const combo = currentCombo();
  const setting = settingFor(scriptKey);
  session = {
    scriptKey,
    combo,
    setting,
    partnerCombo: partnerComboFor(setting, combo),
    turns: SCRIPTS[scriptKey],
    index: 0,
    history: [],
    awaitingChoice: false,
    pending: null,
    userTurnCount: 0,
    finished: false,
  };
  advanceScript();
  renderChatScreen();
}
function advanceScript(){
  while(session.index < session.turns.length){
    const turn = session.turns[session.index];
    if(turn.speaker === 'ai'){
      session.history.push({ speaker:'ai', ...resolveLine(turn, session) });
      session.index++;
    } else {
      session.awaitingChoice = true;
      session.pending = resolveLine(turn, session);
      session._key = `${session.scriptKey}:${session.index}:${session.combo}`;
      return;
    }
  }
  session.finished = true;
}
function pickOption(){
  const line = session.pending;
  session.userTurnCount++;

  const st = statFor(session._key);
  st.seen++;
  st.lastSeen = Date.now();
  st.correct++; // reading/review mode — tapping the line always counts as a rep
  st.streak++;
  st.bestStreak = Math.max(st.bestStreak, st.streak);
  PROGRESS.stats[session._key] = st;
  saveProgress(PROGRESS);

  session.history.push({ speaker:'user', jp:line.jp, romaji:line.romaji, en:line.en });
  session.awaitingChoice = false;
  session.pending = null;
  session.index++;
  renderChatScreen();
}
function continueScript(){ advanceScript(); renderChatScreen(); }
function endConversation(){ session = null; renderChatSetupOrScreen(); }
function restartConversation(){ startConversation(); }

function chatBubbleHTML(h){
  const side = h.speaker === 'ai' ? 'assistant' : 'user';
  return `<div class="bubble-row ${side}"><div class="bubble"><div class="b-jp">${h.jp}</div><div class="b-romaji">${h.romaji}</div><div class="b-en">${h.en}</div></div></div>`;
}
function renderChatScreen(){
  const desc = describeScriptKey(session.scriptKey);
  const meta = comboMeta(session.combo);
  let footer = '';
  if(session.finished){
    footer = `
      <div class="results-inline">
        <div class="ri-big kanji-font">会話終了</div>
        <div class="ri-stats">
          <div class="stat-card" style="flex:1;"><div class="num">${session.userTurnCount}</div><div class="label">lines reviewed</div></div>
        </div>
        <button class="primary-btn" style="margin-top:0;" onclick="endConversation()">Back to scenes</button>
        <button class="secondary-btn" onclick="restartConversation()">Run it again</button>
      </div>`;
  } else if(session.awaitingChoice){
    footer = `<button class="option-bubble" onclick="pickOption()">${session.pending.jp}</button>`;
  } else {
    footer = `<button class="continue-btn" onclick="continueScript()">Continue</button>`;
  }
  app.innerHTML = `
    <div class="chat-header">
      <button class="icon-btn" onclick="endConversation()" aria-label="Back">&#8592;</button>
      <div class="ch-info"><div class="ch-title">${desc.icon} ${desc.title}</div><div class="ch-sub">${session.setting.label} · ${meta.label} ${meta.sub}</div></div>
    </div>
    <div class="chat-body" id="chat-body">${session.history.map(chatBubbleHTML).join('')}</div>
    <div class="chat-footer">${footer}</div>`;
  const body = document.getElementById('chat-body');
  if(body) body.scrollTop = body.scrollHeight;
}

              <div class="ci-tag" style="color:var(${meta.colorVar});">${meta.label} · ${meta.sub}</div>
              <div class="ci-jp kanji-font">${v.jp}</div>
              <div class="ci-romaji">${v.romaji}</div>
              <div class="ci-en">${v.en}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="fc-nav">
        <button onclick="compareStep(-1)">&#8592; Prev</button>
        <button class="next" onclick="compareStep(1)">Next &#8594;</button>
      </div>
    </div>
    ${tabbarHTML()}`;
}
function compareStep(dir){
  const len = fc.pool.length;
  const next = fc.index + dir;
  if(next >= len || next < 0){ fc.pool = shuffle(fc.pool); fc.index = next >= len ? 0 : len-1; }
  else fc.index = next;
  renderCompare();
}

/* =========================================================
   LESSONS
   ========================================================= */
let lessonTab = 'standard';
function selectLessonTab(id){ lessonTab = id; renderLessons(); }
function lessonSectionHTML(sec){
  const heading = sec.heading ? `<h3>${sec.heading}</h3>` : '';
  const paras = (sec.paragraphs || []).map(p => `<p>${p}</p>`).join('');
  const table = sec.table ? `
    <div class="mini-table ${(sec.tableCols||sec.table[0]).length === 3 ? 'jp-col2' : ''}">
      ${sec.tableCols ? `<div class="mini-table-row mini-table-head" style="grid-template-columns:repeat(${sec.tableCols.length},1fr);">${sec.tableCols.map(c => `<div class="mtc">${c}</div>`).join('')}</div>` : ''}
      ${sec.table.map(row => `<div class="mini-table-row" style="grid-template-columns:repeat(${row.length},1fr);">${row.map(c => `<div class="mtc">${c}</div>`).join('')}</div>`).join('')}
    </div>` : '';
  const phrases = sec.phrases ? `
    <div class="phrase-table">
      ${sec.phrases.map(([jp,romaji,en]) => `<div class="phrase-row"><div class="p-jp kanji-font">${jp}</div><div class="p-romaji">${romaji}</div><div class="p-en">${en}</div></div>`).join('')}
    </div>` : '';
  return `<div class="lesson-block">${heading}${paras}${table}${phrases}</div>`;
}
function renderLessons(){
  const l = LESSONS[lessonTab];
  app.innerHTML = `
    <div class="tab-header"><div class="ghost-kanji kanji-font">学</div><h1>Lessons</h1><p>A quick reference for each speaking style before you use it in the chat.</p></div>
    <div class="lesson-tabs">
      ${Object.entries(LESSONS).map(([id,r]) => `<div class="lesson-tab ${lessonTab===id?'active':''}" onclick="selectLessonTab('${id}')">${r.label}</div>`).join('')}
    </div>
    <div class="screen">
      <div class="lesson-block" style="margin-bottom:6px;">
        <h3>${l.label} <span style="color:var(--paper-dim); font-weight:400;">${l.ja}</span></h3>
      </div>
      ${l.sections.map(lessonSectionHTML).join('')}
    </div>
    ${tabbarHTML()}`;
}

/* =========================================================
   PROGRESS
   ========================================================= */
const ALL_COMBOS = [...new Set(PRACTICE_ITEMS.map(it => it.combo))];

function computeComboStats(combo){
  const items = PRACTICE_ITEMS.filter(it => it.combo === combo);
  const counts = { new:0, learning:0, mastered:0 };
  items.forEach(it => {
    const key = `${it.scriptKey}:${it.turnIndex}:${it.combo}`;
    counts[masteryStatus(key)] += 1;
  });
  return { total: items.length, ...counts };
}
function comboProgressBlockHTML(combo){
  const meta = comboMeta(combo);
  const s = computeComboStats(combo);
  const pct = n => s.total>0 ? (n/s.total)*100 : 0;
  return `
    <div class="progress-block">
      <div class="progress-block-head"><span class="pb-label">${meta.label} · ${meta.sub}</span><span class="pb-count">${s.mastered} / ${s.total} mastered</span></div>
      <div class="seg-bar">
        <div style="width:${pct(s.mastered)}%; background:var(--moss);"></div>
        <div style="width:${pct(s.learning)}%; background:var(--gold);"></div>
        <div style="width:${pct(s.new)}%; background:var(--indigo-600);"></div>
      </div>
      <div class="pb-legend">
        <span><i style="background:var(--moss)"></i>Mastered ${s.mastered}</span>
        <span><i style="background:var(--gold)"></i>Learning ${s.learning}</span>
        <span><i style="background:var(--indigo-600)"></i>New ${s.new}</span>
      </div>
    </div>`;
}
function leastPracticed(limit){
  return PRACTICE_ITEMS
    .map(it => ({ it, st: statFor(`${it.scriptKey}:${it.turnIndex}:${it.combo}`) }))
    .filter(row => row.st.seen < 3) // not yet "mastered" by repetition
    .sort((a,b) => a.st.seen - b.st.seen)
    .slice(0, limit);
}
function renderProgress(){
  let mastered=0, learning=0;
  PRACTICE_ITEMS.forEach(it => {
    const key = `${it.scriptKey}:${it.turnIndex}:${it.combo}`;
    const status = masteryStatus(key);
    if(status==='mastered') mastered++;
    if(status==='learning') learning++;
  });
  const total = PRACTICE_ITEMS.length;
  const untouched = leastPracticed(8);
  app.innerHTML = `
    <div class="tab-header"><div class="ghost-kanji kanji-font">歩</div><h1>Progress</h1><p>How many times you've reviewed each line, across every dialect × politeness combo that exists.</p></div>
    <div class="screen">
      <div class="stat-cards">
        <div class="stat-card"><div class="num" style="color:var(--moss)">${mastered}</div><div class="label">mastered (3+ reps)</div></div>
        <div class="stat-card"><div class="num" style="color:var(--gold)">${learning}</div><div class="label">in progress</div></div>
        <div class="stat-card"><div class="num">${total}</div><div class="label">total lines</div></div>
      </div>
      ${ALL_COMBOS.map(comboProgressBlockHTML).join('')}
      <div class="progress-block">
        <div class="progress-block-head"><span class="pb-label">Still building</span>${untouched.length ? '<span class="pb-count">least reviewed first</span>' : ''}</div>
        ${untouched.length ? untouched.map(row => {
          const desc = describeScriptKey(row.it.scriptKey);
          const turn = SCRIPTS[row.it.scriptKey][row.it.turnIndex];
          const line = turn.variants[row.it.combo];
          const meta = comboMeta(row.it.combo);
          return `<div class="mini-row"><span class="mini-sit">${desc.icon} ${line.jp}</span><span class="mini-tag">${meta.label}·${meta.sub}</span><span class="mini-score" style="color:var(--paper-dim);">${row.st.seen}/3</span></div>`;
        }).join('') : '<div class="empty-note">Everything\'s been reviewed 3+ times — nice.</div>'}
      </div>
    </div>
    ${tabbarHTML()}`;
}

/* =========================================================
   BOOT
   ========================================================= */
(async function boot(){
  validateScripts();
  PROGRESS = await loadProgress();
  // Repair saves that point at a scene/topic that no longer exists.
  const sc = getScenario(PROGRESS.scenario);
  if(!sc){ PROGRESS.scenario = 'restaurant'; PROGRESS.topic = null; }
  else if(sc.topics && !sc.topics.some(t => t.id === PROGRESS.topic)) PROGRESS.topic = sc.topics[0].id;
  fixComboForCurrentScript();
  renderActiveTab();
})();
</script>
