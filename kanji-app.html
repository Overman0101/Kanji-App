<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言葉道 — Daily Kanji, N3–N2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-950:#141F33;
    --indigo-900:#1B2A41;
    --indigo-800:#22375A;
    --indigo-700:#2C4468;
    --indigo-600:#3A5075;
    --paper:#F3EFE4;
    --paper-dim:#C9C6BB;
    --gold:#E3A857;
    --gold-dim:#8A6B3B;
    --moss:#6FA287;
    --moss-deep:#3E6650;
    --vermillion:#C1440E;
    --vermillion-deep:#8C3009;
    --radius-tile:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--indigo-800), transparent 60%),
      linear-gradient(180deg, var(--indigo-950) 0%, #101A2C 100%);
    color:var(--paper);
    min-height:100%;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }
  .kanji-font{ font-family:'Shippori Mincho', serif; }

  /* ---------- session topbar (progress only) ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px 10px;
    position:sticky;
    top:0;
    z-index:5;
    background:linear-gradient(180deg, var(--indigo-950) 70%, transparent);
  }
  .progress-track{
    flex:1;
    height:10px;
    border-radius:999px;
    background:var(--indigo-700);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--moss-deep), var(--moss));
    border-radius:999px;
    transition:width .35s ease;
  }
  .icon-btn{
    background:none;
    border:none;
    color:var(--paper-dim);
    font-size:20px;
    cursor:pointer;
    line-height:1;
    padding:4px;
  }

  /* ---------- tab header (non-session) ---------- */
  .tab-header{
    position:relative;
    padding:24px 22px 4px;
  }
  .tab-header .ghost-kanji{
    position:absolute;
    right:0;
    top:-16px;
    font-size:120px;
    color:rgba(243,239,228,0.05);
    z-index:0;
    user-select:none;
  }
  .tab-header h1{
    position:relative;
    z-index:1;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:26px;
    margin:0 0 4px;
  }
  .tab-header p{
    position:relative;
    z-index:1;
    margin:0;
    color:var(--paper-dim);
    font-size:14px;
    line-height:1.5;
    max-width:34ch;
  }

  /* ---------- generic screen ---------- */
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:8px 22px 20px;
    animation:fadein .22s ease;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .level-row{
    display:flex;
    gap:10px;
    margin:18px 0 6px;
    padding:0 22px;
  }
  .level-pill{
    flex:1;
    text-align:center;
    padding:11px 6px;
    border-radius:999px;
    border:1.5px solid var(--indigo-600);
    background:var(--indigo-800);
    color:var(--paper-dim);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:.15s ease;
  }
  .level-pill.active{
    border-color:var(--gold);
    background:rgba(227,168,87,0.14);
    color:var(--gold);
  }

  .stat-cards{
    display:flex;
    gap:12px;
    margin:16px 0 4px;
  }
  .set-preview{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:16px 0 4px;
    padding:0 22px;
  }
  .set-chip{
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    border-radius:10px;
    background:var(--indigo-800);
    border:1px solid var(--indigo-700);
    color:var(--paper);
  }
  .set-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:14px 22px 0;
  }
  .set-nav-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    border:1px solid var(--indigo-600);
    background:var(--indigo-800);
    color:var(--paper);
    font-size:16px;
    cursor:pointer;
  }
  .set-nav-btn:disabled{
    opacity:.35;
    cursor:default;
  }
  .set-nav-label{
    font-size:13px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.02em;
    min-width:110px;
    text-align:center;
  }
  .set-note{
    text-align:center;
    font-size:11px;
    color:var(--paper-dim);
    margin:2px 0 0;
  }
  .stat-card{
    flex:1;
    background:var(--indigo-800);
    border:1px solid var(--indigo-700);
    border-radius:var(--radius-tile);
    padding:14px 12px;
  }
  .stat-card .num{
    font-size:22px;
    font-weight:900;
    line-height:1;
    color:var(--gold);
  }
  .stat-card .label{
    font-size:12px;
    color:var(--paper-dim);
    margin-top:6px;
  }

  .primary-btn{
    display:block;
    width:100%;
    text-align:center;
    padding:16px;
    border-radius:16px;
    border:none;
    background:var(--gold);
    color:var(--indigo-950);
    font-weight:900;
    font-size:16px;
    letter-spacing:.01em;
    cursor:pointer;
    margin-top:22px;
    box-shadow:0 4px 0 var(--gold-dim);
    transition:transform .08s ease;
  }
  .primary-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--gold-dim); }
  .secondary-btn{
    display:block;
    width:100%;
    text-align:center;
    padding:14px;
    border-radius:16px;
    border:1.5px solid var(--indigo-600);
    background:transparent;
    color:var(--paper);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
  }

  /* ---------- FLASHCARDS ---------- */
  .fc-counter{
    text-align:center;
    color:var(--paper-dim);
    font-size:13px;
    font-weight:700;
    letter-spacing:.05em;
    margin:14px 0 10px;
  }
  .flip-card{
    perspective:1200px;
    width:100%;
    flex:1;
    min-height:380px;
    cursor:pointer;
  }
  .flip-inner{
    position:relative;
    width:100%;
    height:100%;
    min-height:380px;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:20px;
    background:var(--indigo-800);
    border:1px solid var(--indigo-700);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:22px;
    text-align:center;
  }
  .flip-back{ transform:rotateY(180deg); }
  .kanji-tag{
    font-size:12px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.08em;
    border:1px solid var(--gold-dim);
    padding:4px 12px;
    border-radius:999px;
  }
  .card-top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
  }
  .status-badge{
    font-size:10px;
    font-weight:800;
    letter-spacing:.08em;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid transparent;
  }
  .status-badge.status-new{
    color:var(--paper-dim);
    border-color:var(--indigo-600);
    background:var(--indigo-800);
  }
  .status-badge.status-learning{
    color:var(--gold);
    border-color:var(--gold-dim);
    background:rgba(227,168,87,0.12);
  }
  .status-badge.status-mastered{
    color:var(--moss);
    border-color:var(--moss-deep);
    background:rgba(111,162,135,0.14);
  }
  .kanji-big{
    font-family:'Shippori Mincho', serif;
    font-size:96px;
    font-weight:600;
    line-height:1;
  }
  .tap-hint{
    font-size:12px;
    color:var(--paper-dim);
  }
  .reading-cards{
    display:flex;
    gap:10px;
    width:100%;
  }
  .reading-card{
    flex:1;
    background:var(--indigo-900);
    border:1px solid var(--indigo-700);
    border-radius:var(--radius-tile);
    padding:10px 8px;
  }
  .reading-card .rlabel{
    font-size:10px;
    letter-spacing:.08em;
    color:var(--paper-dim);
    font-weight:700;
  }
  .reading-card .rvalue{
    font-size:17px;
    font-weight:700;
    margin-top:4px;
  }
  .reading-card.empty .rvalue{ color:var(--paper-dim); font-weight:400; }
  .meaning-hint{
    font-size:13px;
    color:var(--paper-dim);
    font-style:italic;
  }
  .word-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
    max-height:190px;
    overflow-y:auto;
    padding-right:2px;
  }
  .word-item{
    background:var(--indigo-900);
    border:1px solid var(--indigo-700);
    border-radius:var(--radius-tile);
    padding:9px 14px;
    text-align:left;
  }
  .word-item .w-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .word-item .w-word{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    font-weight:700;
  }
  .word-item .w-reading{
    color:var(--gold);
    font-size:12px;
    white-space:nowrap;
  }
  .word-item .w-meaning{
    color:var(--paper-dim);
    font-size:12px;
    margin-top:2px;
  }
  .fc-nav{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .fc-nav button{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:1.5px solid var(--indigo-600);
    background:var(--indigo-800);
    color:var(--paper);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .fc-nav button.next{ background:var(--gold); color:var(--indigo-950); border:none; }

  /* ---------- QUIZ (words + sentences) ---------- */
  .quiz-prompt{
    text-align:center;
    margin:16px 0 6px;
  }
  .quiz-prompt .qsub{
    font-size:13px;
    color:var(--paper-dim);
    font-weight:700;
    letter-spacing:.05em;
  }
  .quiz-prompt .qkanji{
    font-family:'Shippori Mincho', serif;
    font-size:56px;
    margin:10px 0;
    line-height:1.2;
  }
  .quiz-prompt .qsentence{
    font-family:'Shippori Mincho', serif;
    font-size:24px;
    line-height:1.7;
    margin:14px 4px;
  }
  .qsentence .hl{
    color:var(--gold);
    font-weight:700;
    border-bottom:2px solid var(--gold-dim);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:10px;
  }
  .option-btn{
    text-align:left;
    padding:15px 18px;
    border-radius:14px;
    border:1.5px solid var(--indigo-600);
    background:var(--indigo-800);
    color:var(--paper);
    font-size:18px;
    font-weight:600;
    cursor:pointer;
  }
  .option-btn.kanji-opt{ font-family:'Shippori Mincho', serif; font-size:22px; }
  .option-btn:disabled{ cursor:default; }
  .option-btn.correct{
    border-color:var(--moss);
    background:rgba(111,162,135,0.16);
    color:var(--moss);
  }
  .option-btn.wrong{
    border-color:var(--vermillion);
    background:rgba(193,68,14,0.14);
    color:var(--vermillion);
  }

  .feedback-bar{
    position:sticky;
    bottom:0;
    margin:20px -22px 0;
    padding:18px 22px 20px;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .feedback-bar.show{ display:flex; }
  .feedback-bar.correct{ background:rgba(62,102,80,0.94); }
  .feedback-bar.wrong{ background:rgba(140,48,9,0.94); }
  .feedback-bar .fb-text{ font-weight:900; font-size:16px; }
  .feedback-bar .fb-sub{ font-size:13px; opacity:.85; margin-top:2px; }
  .feedback-bar .fb-meaning{ font-size:12px; opacity:.7; margin-top:2px; font-style:italic; }
  .feedback-bar button{
    background:var(--paper);
    color:var(--indigo-950);
    border:none;
    padding:12px 22px;
    border-radius:12px;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    flex:0 0 auto;
  }

  /* ---------- RESULTS ---------- */
  .results-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
  }
  .results-wrap .big-kanji{
    font-family:'Shippori Mincho', serif;
    font-size:60px;
    color:var(--gold);
    margin-bottom:6px;
  }
  .results-wrap h2{
    font-family:'Shippori Mincho', serif;
    font-size:24px;
    margin:0 0 4px;
  }
  .results-wrap p.sub{
    color:var(--paper-dim);
    margin:0 0 16px;
    font-size:14px;
  }
  .results-grid{ display:flex; gap:12px; width:100%; }

  /* ---------- bottom tab bar ---------- */
  .tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    border-top:1px solid var(--indigo-700);
    background:rgba(20,31,51,0.92);
    backdrop-filter:blur(6px);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    padding:8px 4px;
    cursor:pointer;
    color:var(--paper-dim);
  }
  .tab-btn .tico{
    font-family:'Shippori Mincho', serif;
    font-size:20px;
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--indigo-800);
    border:1px solid var(--indigo-700);
  }
  .tab-btn.active{ color:var(--gold); }
  .tab-btn.active .tico{ border-color:var(--gold); color:var(--gold); background:rgba(227,168,87,0.12); }
  .tab-btn .tlabel{ font-size:11px; font-weight:700; }

  .progress-block{
    background:var(--indigo-800);
    border:1px solid var(--indigo-700);
    border-radius:var(--radius-tile);
    padding:16px 16px 14px;
    margin-top:16px;
  }
  .progress-block-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .progress-block .pb-label{
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;
  }
  .progress-block .pb-count{
    font-size:12px;
    color:var(--paper-dim);
  }
  .seg-bar{
    display:flex;
    height:10px;
    border-radius:999px;
    overflow:hidden;
    background:var(--indigo-700);
  }
  .pb-legend{
    display:flex;
    gap:14px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .pb-legend span{
    font-size:11px;
    color:var(--paper-dim);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .pb-legend i{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:999px;
  }
  .progress-note{
    font-size:12px;
    color:var(--paper-dim);
    line-height:1.6;
    margin-top:18px;
  }
  .mini-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 2px;
    border-bottom:1px solid var(--indigo-700);
    cursor:pointer;
  }
  .mini-row:last-child{ border-bottom:none; }
  .mini-row .mini-kanji{
    font-size:20px;
    width:28px;
    flex:0 0 auto;
    text-align:center;
  }
  .mini-row .mini-info{
    flex:1;
    min-width:0;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .mini-row .mini-word{
    font-size:13px;
    font-weight:700;
  }
  .mini-row .mini-reading{
    font-size:11px;
    color:var(--gold);
  }
  .mini-row .mini-score{
    font-size:12px;
    color:var(--vermillion);
    font-weight:800;
    flex:0 0 auto;
  }
  .mastered-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .mastered-chip{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    border-radius:10px;
    background:rgba(111,162,135,0.14);
    border:1px solid var(--moss-deep);
    color:var(--moss);
    cursor:pointer;
  }
  .search-input{
    width:100%;
    padding:13px 16px;
    border-radius:14px;
    border:1.5px solid var(--indigo-600);
    background:var(--indigo-800);
    color:var(--paper);
    font-size:15px;
    margin:14px 0 6px;
  }
  .search-input::placeholder{ color:var(--paper-dim); }
  .list-count{
    font-size:12px;
    color:var(--paper-dim);
    margin-bottom:8px;
  }
  .list-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 10px;
    border-bottom:1px solid var(--indigo-700);
    cursor:pointer;
  }
  .list-row:active{ background:var(--indigo-800); }
  .list-row .lr-kanji{
    font-size:28px;
    width:38px;
    flex:0 0 auto;
    text-align:center;
  }
  .list-row .lr-info{
    flex:1;
    min-width:0;
  }
  .list-row .lr-readings{
    font-size:11px;
    color:var(--paper-dim);
    letter-spacing:.03em;
  }
  .list-row .lr-word{
    font-size:15px;
    font-weight:700;
    margin-top:2px;
  }
  .list-row .lr-word .lr-reading{
    color:var(--gold);
    font-size:11px;
    font-weight:400;
    margin-left:6px;
  }
  .list-row .lr-meaning{
    font-size:12px;
    color:var(--paper-dim);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-top:1px;
  }
  .list-row .lr-badge{
    flex:0 0 auto;
    font-size:9px;
    padding:3px 7px;
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   KANJI DATA — curated intermediate set (JLPT N3 / N2 range)
   kun:'―' means no common independent kun'yomi
   sentence: a natural example sentence containing `word`
             exactly as written, used for the Sentences tab
   ========================================================= */
const KANJI = [
  {c:'悪', level:'N3', on:'アク', kun:'わるい', meaning:'bad, evil', word:'悪化', wordReading:'あっか', wordMeaning:'worsening', sentence:'天気が悪化してきた。'},
  {c:'決', level:'N3', on:'ケツ', kun:'きめる', meaning:'decide', word:'決定', wordReading:'けってい', wordMeaning:'decision', sentence:'会議で新しい方針が決定した。'},
  {c:'泣', level:'N3', on:'キュウ', kun:'なく', meaning:'cry, weep', word:'泣く', wordReading:'なく', wordMeaning:'to cry', sentence:'子供が大きな声で泣く。'},
  {c:'笑', level:'N3', on:'ショウ', kun:'わらう', meaning:'laugh, smile', word:'笑顔', wordReading:'えがお', wordMeaning:'smiling face', sentence:'彼女はいつも笑顔で挨拶する。'},
  {c:'怒', level:'N3', on:'ド', kun:'おこる', meaning:'anger', word:'怒る', wordReading:'おこる', wordMeaning:'to get angry', sentence:'母は私のうそに怒る。'},
  {c:'悲', level:'N3', on:'ヒ', kun:'かなしい', meaning:'sad, sorrow', word:'悲しい', wordReading:'かなしい', wordMeaning:'sad', sentence:'別れは本当に悲しい。'},

/* =========================================================
   STORAGE — remembers per-kanji performance (for weakest-first
   ordering) and total review count. No streaks / hearts / XP.
   ========================================================= */
const STORE_KEY = 'kanji_reading_progress_v2';
function defaultProgress(){
  return { level:'MIXED', totalReviewed:0, stats:{}, setIndex:{ N3:0, N2:0, MIXED:0 } };
}
// One-time migration: earlier versions keyed progress by array position
// (k.id) instead of the character itself. Array position isn't a stable
// identity once entries can be inserted/removed, so we remap any legacy
// numeric keys to the actual character they pointed to at the time.
function migrateStats(stats){
  let changed = false;
  const migrated = {};
  Object.entries(stats).forEach(([key, val]) => {
    if(/^\d+$/.test(key)){
      const k = KANJI[parseInt(key, 10)];
      if(k){ migrated[k.c] = val; changed = true; }
    } else {
      migrated[key] = val;
    }
  });
  return { migrated, changed };
}
async function loadProgress(){
  try{
    const res = await window.storage.get(STORE_KEY);
    if(res && res.value){
      const p = Object.assign(defaultProgress(), JSON.parse(res.value));
      const { migrated, changed } = migrateStats(p.stats);
      p.stats = migrated;
      if(changed) saveProgress(p); // persist the migrated shape
      return p;
    }
  }catch(e){}
  return defaultProgress();
}
async function saveProgress(p){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(p)); }
  catch(e){ console.error('save failed', e); }
}

function poolForLevel(level){
  return level === 'MIXED' ? KANJI : KANJI.filter(k => k.level === level);
}
function statFor(c){ return PROGRESS.stats[c] || {seen:0, correct:0}; }
function masteryStatus(c){
  const st = statFor(c);
  if(st.correct >= 3) return 'mastered';
  if(st.seen > 0) return 'learning';
  return 'new';
}
const STATUS_LABEL = { new:'NEW', learning:'LEARNING', mastered:'MASTERED' };
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* =========================================================
   FIXED SET SYSTEM — the kanji list for each level is split into
   evenly-sized, numbered sets (Set 1, Set 2, ...), calculated from
   the actual count so nothing is left as an awkward tiny leftover
   set. Flashcards, Words, and Sentences all study the SAME set —
   navigate between sets with changeSet(), not by re-randomizing.
   ========================================================= */
function getLevelPlan(level){
  const pool = poolForLevel(level);
  const total = pool.length;
  const totalSets = Math.max(1, Math.ceil(total / SET_SIZE));
  const base = Math.floor(total / totalSets);
  const extra = total - base * totalSets; // first `extra` sets get one bonus kanji
  return { pool, total, totalSets, base, extra };
}
function getSetKanji(level, setIndex){
  const plan = getLevelPlan(level);
  const idx = Math.max(0, Math.min(setIndex, plan.totalSets - 1));
  const bigSetSize = plan.base + 1;
  let start;
  if(idx < plan.extra){
    start = idx * bigSetSize;
  } else {
    start = plan.extra * bigSetSize + (idx - plan.extra) * plan.base;
  }
  const size = idx < plan.extra ? bigSetSize : plan.base;
  return { kanji: plan.pool.slice(start, start + size), setIndex: idx, totalSets: plan.totalSets };
}
// The shared set that Flashcards, Words, and Sentences all draw from.
// Flashcards is where it's normally browsed (shuffled display order);
// Words/Sentences quiz on the exact same kanji rather than picking their own.
function ensureStudySet(level){
  if(!PROGRESS.setIndex) PROGRESS.setIndex = { N3:0, N2:0, MIXED:0 };
  const idx = PROGRESS.setIndex[level] ?? 0;
  if(!studySet || studySet.level !== level || studySet.setIndex !== idx){
    const result = getSetKanji(level, idx);
    studySet = { level, setIndex: result.setIndex, totalSets: result.totalSets, kanji: result.kanji };
  }
  return studySet;
}
function changeSet(dir){
  const level = PROGRESS.level;
  const plan = getLevelPlan(level);
  if(!PROGRESS.setIndex) PROGRESS.setIndex = { N3:0, N2:0, MIXED:0 };
  let idx = (PROGRESS.setIndex[level] ?? 0) + dir;
  idx = Math.max(0, Math.min(idx, plan.totalSets - 1));
  PROGRESS.setIndex[level] = idx;
  saveProgress(PROGRESS);
  fc = null;
  session = null;
  studySet = null;
  renderActiveTab();
}
// Used after finishing a Words/Sentences quiz: move to the next set,
// wrapping back to Set 1 after the last one (rather than randomizing).
function goToNextSetOrWrap(){
  const level = PROGRESS.level;
  const plan = getLevelPlan(level);
  if(!PROGRESS.setIndex) PROGRESS.setIndex = { N3:0, N2:0, MIXED:0 };
  let idx = (PROGRESS.setIndex[level] ?? 0) + 1;
  if(idx >= plan.totalSets) idx = 0;
  PROGRESS.setIndex[level] = idx;
  saveProgress(PROGRESS);
  fc = null;
  session = null;
  studySet = null;
}

function computeLevelStats(level){
  const pool = poolForLevel(level);
  const counts = { new:0, learning:0, mastered:0 };
  let correctSum = 0, seenSum = 0;
  pool.forEach(k => {
    counts[masteryStatus(k.c)] += 1;
    const st = statFor(k.c);
    correctSum += st.correct;
    seenSum += st.seen;
  });
  return {
    total: pool.length,
    ...counts,
    accuracy: seenSum > 0 ? Math.round((correctSum / seenSum) * 100) : null,
  };
}
function levelProgressBlockHTML(label, level){
  const s = computeLevelStats(level);
  const pct = n => s.total > 0 ? (n / s.total) * 100 : 0;
  return `

        <span><i style="background:var(--gold)"></i>Learning ${s.learning}</span>
        <span><i style="background:var(--indigo-600)"></i>New ${s.new}</span>
      </div>
    </div>`;
}
function weakSpots(limit){
  return KANJI
    .map(k => ({ k, st: statFor(k.c) }))
    .filter(x => x.st.seen > 0 && x.st.correct < x.st.seen)
    .sort((a, b) => {
      const missA = a.st.seen - a.st.correct, missB = b.st.seen - b.st.correct;
      if(missB !== missA) return missB - missA;
      return (a.st.correct / a.st.seen) - (b.st.correct / b.st.seen);
    })
    .slice(0, limit)
    .map(x => x.k);
}
function masteredKanji(){
  return KANJI.filter(k => masteryStatus(k.c) === 'mastered');
}

function filterMasterList(){
  const input = document.getElementById('kanji-search');
  const query = input ? input.value.trim().toLowerCase() : masterListQuery;
  masterListQuery = query;
  const pool = poolForLevel(PROGRESS.level);
  const filtered = !query ? pool : pool.filter(k =>
    k.c.includes(query) ||
    k.on.toLowerCase().includes(query) ||
    k.kun.toLowerCase().includes(query) ||
    k.meaning.toLowerCase().includes(query) ||
    k.words.some(w => w.word.includes(query) || w.reading.includes(query) || w.meaning.toLowerCase().includes(query))

  const results = document.getElementById('master-list-results');

      : '<div class="empty-note">No matches for that search.</div>';

function fcStep(dir){
  const len = fc.pool.length;
  const next = fc.index + dir;
  if(next >= len || next < 0){
    fc.pool = shuffle(fc.pool); // completed a pass — reshuffle for the next one
    fc.index = next >= len ? 0 : len - 1;
  } else {
    fc.index = next;
  }
  fc.flipped = false;
  renderFlashcards();
}

function buildWordQuestion(k, level){
  const pool = poolForLevel(level);
  const asReading = Math.random() < 0.5;
  if(asReading){
    const distractors = shuffle(pool.filter(x => x.id !== k.id && x.wordReading !== k.wordReading).map(x => x.wordReading)).slice(0,3);
    return { kind:'kanjiOpts:false', sub:'SELECT THE READING', promptType:'kanji', prompt:k.word, correct:k.wordReading, meaning:k.wordMeaning, options: shuffle([k.wordReading, ...distractors]) };
  } else {
    const distractors = shuffle(pool.filter(x => x.id !== k.id && x.word !== k.word).map(x => x.word)).slice(0,3);
    return { kind:'kanjiOpts:true', sub:'SELECT THE MATCHING WORD', promptType:'kana', prompt:k.wordReading, correct:k.word, meaning:k.wordMeaning, options: shuffle([k.word, ...distractors]) };
  }
}

/* =========================================================

   ========================================================= */
function renderQuizStep(){
  if(session.index >= session.total) return renderResults();
  const k = session.set[session.index];
  const q = session.mode === 'words' ? buildWordQuestion(k, session.level) : buildSentenceQuestion(k, session.level);
  session._q = q;

  const promptHTML = q.promptType === 'sentence'
    ? `<div class="qsentence kanji-font">${q.prompt}</div>`
    : `<div class="qkanji kanji-font">${q.prompt}</div>`;
  const optClass = (q.promptType === 'kana') ? 'option-btn kanji-opt' : 'option-btn';

  app.innerHTML = `
    ${topbarHTML()}
    <div class="screen">
      <div class="quiz-prompt">
        <div class="qsub">${q.sub || 'SELECT THE READING'}</div>
        ${promptHTML}
      </div>
      <div class="options" id="opts">
        ${q.options.map((opt,i) => `<button class="${optClass}" data-i="${i}" onclick="answerQuiz(${i})">${opt}</button>`).join('')}
      </div>
      <div id="fbbar"></div>
    </div>
  `;
}

function answerQuiz(i){
  const k = session.set[session.index];
  const q = session._q;
  const chosen = q.options[i];
  const isCorrect = chosen === q.correct;

  const buttons = document.querySelectorAll('#opts .option-btn');
  buttons.forEach(b => b.disabled = true);
  buttons.forEach(b => { if(b.textContent === q.correct) b.classList.add('correct'); });
  if(!isCorrect) buttons[i].classList.add('wrong');

  const st = statFor(k.c);
  st.seen += 1;
  if(isCorrect){ st.correct += 1; session.correct += 1; }
  PROGRESS.stats[k.c] = st;
  PROGRESS.totalReviewed += 1;

  const label = q.promptType === 'kana'
    ? (isCorrect ? 'Word: ' : 'Correct word: ')
    : (isCorrect ? 'Reading: ' : 'Correct reading: ');
  const bar = document.getElementById('fbbar');
  bar.innerHTML = `
    <div class="feedback-bar show ${isCorrect ? 'correct' : 'wrong'}">
      <div>
        <div class="fb-text">${isCorrect ? 'Correct' : 'Not quite'}</div>
        <div class="fb-sub">${label}${q.correct}</div>
        <div class="fb-meaning">${q.meaning}</div>
      </div>
      <button onclick="afterQuizAnswer()">Continue</button>
    </div>
  `;
}
function afterQuizAnswer(){
  session.index += 1;
  renderQuizStep();
}

        </div>
        <button class="primary-btn" style="width:100%;" onclick="switchTab('${mode}')">Back to ${mode === 'words' ? 'Words' : 'Sentences'}</button>
        <button class="secondary-btn" style="width:100%;" onclick="goToNextSetOrWrap(); ${mode === 'words' ? 'startWords()' : 'startSentences()'}">Next set &#8594;</button>
      </div>
    </div>
  `;
}

/* =========================================================
   BOOT
   ========================================================= */
(async function boot(){
  PROGRESS = await loadProgress();
  renderActiveTab();
})();
</script>
</body>
</html>
